# Overlay for the production image behind the host's HTTPS /preprod/ proxy.
# Use ONLY with --project-name ooo-preprod and an independent .env/volume set.
services:
  app:
    ports: !override ["127.0.0.1:18002:8000"]
    command: [python, -m, uvicorn, "app.main:app", --host, "0.0.0.0", --port, "8000", --workers, "1", --root-path, /preprod, --no-access-log]
    mem_limit: 256m
    cpus: 0.5
  worker:
    mem_limit: 320m
    cpus: 0.5
  webhook_worker:
    mem_limit: 192m
    cpus: 0.25
  telegram:
    # The VPS cannot reach the DNS-selected Telegram address. This address
    # was verified from this host with normal TLS certificate validation.
    extra_hosts: ["api.telegram.org:${TELEGRAM_API_IPV4:-149.154.167.220}"]
    mem_limit: 256m
    cpus: 0.5
  postgres:
    mem_limit: 256m
    cpus: 0.5
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=50]
  redis:
    mem_limit: 96m
    cpus: 0.25
    command: [redis-server, --appendonly, "yes", --maxmemory, 64mb, --maxmemory-policy, noeviction]
  nginx:
    profiles: [standalone-nginx]
