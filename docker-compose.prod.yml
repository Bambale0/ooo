# Standalone production stack: docker compose --env-file .env -f docker-compose.prod.yml up -d
x-runtime: &runtime
  image: ${NEIRONYCH_IMAGE:?Set NEIRONYCH_IMAGE to an immutable image digest or commit tag}
  env_file: .env
  environment:
    APP_ENV: production
    APP_REVISION: ${APP_REVISION:?Set APP_REVISION to the image commit SHA}
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 60s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *runtime
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *runtime
    command: [python, -m, app.workers.generation_worker]
    healthcheck:
      disable: true
  webhook_worker:
    <<: *runtime
    command: [python, -m, app.workers.webhook_worker]
    healthcheck:
      disable: true
  telegram:
    <<: *runtime
    profiles: [telegram]
    command: [python, -m, app.telegram.main]
    healthcheck:
      disable: true
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neironych}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-neironych}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      app:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
