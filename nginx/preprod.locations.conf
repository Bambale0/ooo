# Include inside the existing TLS server block, alongside the production location /.
# Upstream strips /preprod; Uvicorn and PUBLIC_API_BASE_URL retain the public prefix.
location = /preprod { return 308 /preprod/; }
location = /preprod/internal { return 404; }
location ^~ /preprod/internal/ { return 404; }
location /preprod/ {
    proxy_pass http://127.0.0.1:18002/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 660s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    add_header X-Robots-Tag "noindex, nofollow" always;
}
