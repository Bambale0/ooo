# Production Nginx config with TLS
limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

upstream api {
    server app:8000;
}

server {
    listen 80;
    server_name api.нейроныч.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.нейроныч.online;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /internal/metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 350m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 660s;
        proxy_send_timeout 30s;
        limit_req zone=api burst=200 nodelay;
        limit_req_status 429;
    }

    location /api/v1/media/ {
        # Trial download paths contain a short-lived bearer signature.
        access_log off;
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "private, no-store" always;
    }
}

server {
    listen 443 ssl http2;
    server_name docs.нейроныч.online;
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    # The public documentation host exposes only the minimal model-connection
    # guide. Full OpenAPI, prices, admin, billing and operational endpoints are
    # intentionally unreachable through docs.нейроныч.online.
    location = / {
        proxy_pass http://api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /docs {
        proxy_pass http://api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /guide {
        return 302 /docs$is_args$args;
    }

    location / {
        return 404;
    }
}
