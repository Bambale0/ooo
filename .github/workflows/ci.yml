name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neironych
          POSTGRES_PASSWORD: neironych # pragma: allowlist secret
          POSTGRES_DB: neironych_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neironych -d neironych_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://neironych:neironych@localhost:5432/neironych_ci # pragma: allowlist secret
      TEST_POSTGRES_DATABASE_URL: postgresql+asyncpg://neironych:neironych@localhost:5432/neironych_ci # pragma: allowlist secret
      REDIS_URL: redis://localhost:6379/0
      ADMIN_API_TOKEN: ci-admin-token # pragma: allowlist secret
      ARGOLINK_API_KEY: ci-argolink-key # pragma: allowlist secret

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify main commit came through a merged PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ops/release/check_main_provenance.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Install security scanners
        run: python -m pip install "bandit>=1.8,<2" "pip-audit>=2.9,<3" "detect-secrets>=1.5,<2"

      - name: Lint
        run: python -m ruff check .

      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

      - name: Python SAST
        run: bandit -r app -ll -ii

      - name: Secret scan
        run: |
          # Exact public catalog revision, not a credential; other revisions still require review.
          detect-secrets scan app ops .github Dockerfile docker-compose.yml .env.example --exclude-secrets '^5ce662ba88c3d07f$' --exclude-files 'ops/load/README\\.md' > /tmp/secrets.json
          python - <<'PY'
          import json
          import sys

          with open("/tmp/secrets.json", encoding="utf-8") as handle:
              report = json.load(handle)

          findings = {
              path: items
              for path, items in report.get("results", {}).items()
              if items
          }
          for path, items in sorted(findings.items()):
              for item in items:
                  print(f"{path}:{item.get('line_number')}: {item.get('type')}")
          sys.exit(1 if findings else 0)
          PY
          if grep -RInE 'sk-asale-[A-Za-z0-9_-]{20,}'             app ops docs .github *.md Dockerfile docker-compose*.yml .env.example; then
            echo "Asale API key pattern detected in repository content" >&2
            exit 1
          fi

      - name: Apply migrations
        run: alembic upgrade head

      - name: Check ORM matches migrated schema
        run: alembic check

      - name: Test
        run: python -m pytest -q

      - name: Encrypted backup and isolated restore
        env:
          PGPASSWORD: neironych # pragma: allowlist secret
        run: |
          docker build -t neironych-backup-ci ops/backup
          backup_test_dir=$(mktemp -d)
          chmod 700 "$backup_test_dir"
          python ops/smoke/seed_restore_fixture.py --confirm-isolated --support-dir "$backup_test_dir/support"
          docker run --rm --entrypoint age-keygen neironych-backup-ci > "$backup_test_dir/recovery.key"
          chmod 600 "$backup_test_dir/recovery.key"
          recipient=$(docker run --rm --user "$(id -u):$(id -g)" -v "$backup_test_dir:/backup" --entrypoint age-keygen neironych-backup-ci -y /backup/recovery.key)
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$backup_test_dir:/backup" \
            -e PGHOST=127.0.0.1 -e PGUSER=neironych -e PGPASSWORD -e PGDATABASE=neironych_ci \
            -e BACKUP_DIR=/backup -e SUPPORT_STORAGE_DIR=/backup/support -e BACKUP_LOCAL_ONLY=1 -e AGE_RECIPIENT="$recipient" neironych-backup-ci
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$backup_test_dir:/backup:ro" \
            -e PGHOST=127.0.0.1 -e PGUSER=neironych -e PGPASSWORD -e PGDATABASE=restore_test_ci \
            -e BACKUP_FILE=/backup/latest.dump.age -e AGE_IDENTITY_FILE=/backup/recovery.key \
            -e SUPPORT_BACKUP_FILE=/backup/latest.support.tar.age -e RESTORE_SUPPORT_DIR=/tmp/restore_test_support \
            --entrypoint /usr/local/bin/restore-test.sh neironych-backup-ci
          rm -rf "$backup_test_dir"

      - name: Encrypted WAL point-in-time recovery
        run: |
          docker build -t ooo-pitr-check ops/backup/postgres
          python ops/smoke/pitr.py

      - name: Validate production Nginx config
        run: |
          cert_dir=$(mktemp -d)
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout "$cert_dir/privkey.pem" \
            -out "$cert_dir/fullchain.pem" \
            -subj "/CN=localhost" \
            -days 1 >/dev/null 2>&1
          docker run --rm \
            --add-host app:127.0.0.1 \
            -v "$PWD/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$cert_dir:/etc/nginx/ssl:ro" \
            nginx:stable-alpine nginx -t
          rm -rf "$cert_dir"

      - name: Build production image
        env:
          IMAGE_TAG: neironych-ci:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE_TAG" .
          docker run --rm --entrypoint python "$IMAGE_TAG" -m app.providers.infai_export --help
