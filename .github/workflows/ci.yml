name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neironych
          POSTGRES_PASSWORD: neironych
          POSTGRES_DB: neironych_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neironych -d neironych_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://neironych:neironych@localhost:5432/neironych_ci
      TEST_POSTGRES_DATABASE_URL: postgresql+asyncpg://neironych:neironych@localhost:5432/neironych_ci
      REDIS_URL: redis://localhost:6399/0
      ADMIN_API_TOKEN: ci-admin-token
      ARGOLINK_API_KEY: ci-argolink-key
      PROVIDER_CREDENTIALS_MASTER_KEY: ci-provider-credentials-master-key-32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test
        run: python -m pytest -q
