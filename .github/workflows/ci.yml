name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neironych
          POSTGRES_PASSWORD: neironych
          POSTGRES_DB: neironych_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neironych -d neironych_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://neironych:neironych@localhost:5432/neironych_ci
      TEST_POSTGRES_DATABASE_URL: postgresql+asyncpg://neironych:neironych@localhost:5432/neironych_ci
      REDIS_URL: redis://localhost:6379/0
      ADMIN_API_TOKEN: ci-admin-token
      ARGOLINK_API_KEY: ci-argolink-key

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install security scanners
        run: python -m pip install "bandit>=1.8,<2" "pip-audit>=2.9,<3" "detect-secrets>=1.5,<2"

      - name: Lint
        run: python -m ruff check .

      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable

      - name: Python SAST
        run: bandit -r app -ll -ii

      - name: Secret scan
        run: |
          detect-secrets scan app ops .github Dockerfile docker-compose.yml .env.example > /tmp/secrets.json
          python - <<'PY'
          import json
          import sys

          with open("/tmp/secrets.json", encoding="utf-8") as handle:
              report = json.load(handle)

          findings = {
              path: items
              for path, items in report.get("results", {}).items()
              if items
          }
          for path, items in sorted(findings.items()):
              for item in items:
                  print(f"{path}:{item.get('line_number')}: {item.get('type')}")
          sys.exit(1 if findings else 0)
          PY

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test
        run: python -m pytest -q

      - name: Build production image
        env:
          IMAGE_TAG: neironych-ci:${{ github.sha }}
        run: docker build --tag "$IMAGE_TAG" .
