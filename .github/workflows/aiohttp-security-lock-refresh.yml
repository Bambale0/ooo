name: Refresh aiohttp security locks
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/aiohttp-3.14.4-locks-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Update only aiohttp pin and verified release hashes
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          def metadata(version):
              request = urllib.request.Request(
                  f'https://pypi.org/pypi/aiohttp/{version}/json',
                  headers={'User-Agent': 'neironych-security-lock-refresh'},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          old, new = metadata('3.14.3'), metadata('3.14.4')
          assert new['info']['version'] == '3.14.4'
          assert sorted(old['info']['requires_dist']) == sorted(new['info']['requires_dist'])
          hashes = sorted({item['digests']['sha256'] for item in new['urls'] if not item['yanked']})
          assert hashes and all(re.fullmatch('[0-9a-f]{64}', value) for value in hashes)
          slash = chr(92)
          block = 'aiohttp==3.14.4 ' + slash + '\n'
          block += '\n'.join('    --hash=sha256:' + value + (' ' + slash if i < len(hashes)-1 else '') for i, value in enumerate(hashes)) + '\n'
          for name in ('requirements.lock', 'requirements-dev.lock'):
              path = Path(name)
              lines = path.read_text().splitlines(keepends=True)
              start = next(i for i, line in enumerate(lines) if line.startswith('aiohttp==3.14.3 '))
              end = start + 1
              while end < len(lines) and lines[end].startswith('    --hash=sha256:'):
                  end += 1
              assert end > start + 1
              path.write_text(''.join(lines[:start]) + block + ''.join(lines[end:]))
          print('Updated aiohttp only; release hashes:', len(hashes))
          PY
      - name: Validate complete hashed resolution
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Commit locks to this same repair branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.lock requirements-dev.lock
          git diff --cached --check
          git commit -m 'fix(deps): pin aiohttp 3.14.4 security release with verified hashes'
          git push origin HEAD:refs/heads/fix/aiohttp-3.14.4-locks-20261020
