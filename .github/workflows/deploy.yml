name: Deploy to Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Production stays fail-closed until the repository is explicitly armed.
    # Set repository Actions variable PRODUCTION_DEPLOY_ENABLED=true only after
    # the production host, SSH identity, known_hosts and environment are ready.
    if: github.event.workflow_run.conclusion == 'success' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry path
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push immutable production image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install pinned SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Package and upload verified release configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          bundle="/tmp/neironych-${RELEASE_SHA}.tar.gz"
          tar -czf "$bundle" \
            docker-compose.prod.yml \
            docker-compose.pitr.yml \
            nginx/production.conf \
            ops/backup/postgres
          scp -o BatchMode=yes -i ~/.ssh/deploy_key \
            "$bundle" "deploy@$DEPLOY_HOST:/tmp/neironych-${RELEASE_SHA}.tar.gz"

      - name: Deploy verified revision with automatic rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          ssh -o BatchMode=yes -i ~/.ssh/deploy_key "deploy@$DEPLOY_HOST" \
            "RELEASE_SHA='${RELEASE_SHA}' REPOSITORY='${{ github.repository }}' bash -s" <<'SSH'
          set -euo pipefail

          REPO="ghcr.io/${REPOSITORY,,}"
          TAG="${RELEASE_SHA}"
          ROOT="/opt/neironych"
          RELEASES="${ROOT}/releases"
          SHARED="${ROOT}/shared"
          RELEASE_DIR="${RELEASES}/${TAG}"
          REVISION_FILE="${ROOT}/REVISION"
          PREVIOUS_TAG="$(cat "${REVISION_FILE}" 2>/dev/null || true)"
          BUNDLE="/tmp/neironych-${TAG}.tar.gz"

          mkdir -p "${RELEASES}" "${SHARED}" "${RELEASE_DIR}" "${SHARED}/nginx"
          test -f "${BUNDLE}"
          test -f "${SHARED}/.env"
          test -f "${SHARED}/.backup.env"
          test -f "${SHARED}/nginx/ssl/fullchain.pem"
          test -f "${SHARED}/nginx/ssl/privkey.pem"

          tar -xzf "${BUNDLE}" -C "${RELEASE_DIR}"
          rm -f "${BUNDLE}"

          ln -sfn "${SHARED}/.env" "${RELEASE_DIR}/.env"
          ln -sfn "${SHARED}/.backup.env" "${RELEASE_DIR}/.backup.env"
          mkdir -p "${RELEASE_DIR}/nginx"
          ln -sfn "${SHARED}/nginx/ssl" "${RELEASE_DIR}/nginx/ssl"

          compose_for() {
            release_dir="$1"
            shift
            docker compose \
              --project-name neironych \
              --env-file "${release_dir}/.env" \
              -f "${release_dir}/docker-compose.prod.yml" \
              -f "${release_dir}/docker-compose.pitr.yml" \
              "$@"
          }

          verify_revision() {
            expected="$1"
            for attempt in $(seq 1 12); do
              sleep 5
              status="$(curl -fsS http://localhost:8000/api/v1/readiness 2>/dev/null || true)"
              if printf '%s' "$status" | grep -Fq "\"revision\":\"${expected}\""; then
                return 0
              fi
              echo "Waiting for revision ${expected}; attempt ${attempt}/12"
            done
            return 1
          }

          rollback() {
            if [ -z "${PREVIOUS_TAG}" ]; then
              echo "No previous revision recorded; automatic rollback is unavailable"
              return 1
            fi

            previous_dir="${RELEASES}/${PREVIOUS_TAG}"
            if [ ! -d "${previous_dir}" ]; then
              echo "Previous release bundle ${previous_dir} is missing"
              return 1
            fi

            echo "Rolling back application and runtime configuration to ${PREVIOUS_TAG}"
            export NEIRONYCH_IMAGE="${REPO}:${PREVIOUS_TAG}"
            export APP_REVISION="${PREVIOUS_TAG}"
            docker pull "${NEIRONYCH_IMAGE}"
            compose_for "${previous_dir}" --profile telegram up -d --no-build \
              app worker webhook_worker telegram nginx
            verify_revision "${PREVIOUS_TAG}"
          }

          export NEIRONYCH_IMAGE="${REPO}:${TAG}"
          export APP_REVISION="${TAG}"

          docker pull "${NEIRONYCH_IMAGE}"

          # Keep the PITR image/config versioned with the release bundle.
          compose_for "${RELEASE_DIR}" build postgres

          # Migrations follow expand/deploy/contract so the previous application
          # release remains compatible if health verification forces rollback.
          compose_for "${RELEASE_DIR}" run --rm -e APP_REVISION="${TAG}" app alembic upgrade head

          # A production release includes every mandatory runtime process and the
          # external TLS proxy, not only the API container.
          compose_for "${RELEASE_DIR}" --profile telegram up -d --no-build \
            app worker webhook_worker telegram nginx

          if verify_revision "${TAG}"; then
            ln -sfn "${RELEASE_DIR}" "${ROOT}/current"
            printf '%s\n' "${TAG}" > "${REVISION_FILE}"
            echo "Deploy verified: revision ${TAG} is live"
            exit 0
          fi

          echo "ERROR: revision ${TAG} did not become ready; attempting rollback"
          if rollback; then
            echo "Rollback verified: revision ${PREVIOUS_TAG} is live"
          else
            echo "CRITICAL: automatic rollback failed"
          fi
          exit 1
          SSH
