name: Build release candidate

# Building a candidate is safe; production deployment is an explicit environment operation.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require successful CI for this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count > 0' | grep -qx true
      - name: Authenticate registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build immutable candidate
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
