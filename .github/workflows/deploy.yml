name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }},ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production VPS
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.DEPLOY_HOST }} bash << 'SSH'
            set -euo pipefail
            
            REPO="ghcr.io/${{ github.repository }}"
            TAG="${{ github.sha }}"
            COMPOSE_DIR="/opt/neironych"
            REVISION_FILE="${COMPOSE_DIR}/REVISION"
            
            # Write revision
            echo "${TAG}" > "${REVISION_FILE}"
            
            # Pull new image
            docker pull "${REPO}:${TAG}"
            
            # Run migrations (expand then contract)
            docker compose -f "${COMPOSE_DIR}/docker-compose.yml" \
              -f "${COMPOSE_DIR}/docker-compose.prod.yml" run --rm \
              -e APP_REVISION="${TAG}" app alembic upgrade head --sql
            docker compose -f "${COMPOSE_DIR}/docker-compose.yml" \
              -f "${COMPOSE_DIR}/docker-compose.prod.yml" run --rm \
              -e APP_REVISION="${TAG}" app alembic upgrade head
            
            # Update image tag and deploy
            export APP_REVISION="${TAG}"
            docker compose -f "${COMPOSE_DIR}/docker-compose.yml" \
              -f "${COMPOSE_DIR}/docker-compose.prod.yml" up -d app worker webhook_worker
            
            # Verify health
            for i in {1..12}; do
              sleep 5
              STATUS=$(curl -fsS http://localhost:8000/api/v1/health/readiness 2>/dev/null || echo "")
              if echo "${STATUS}" | grep -q '"revision":"'"${TAG}"'"'; then
                echo "Deploy verified: revision ${TAG} is live"
                exit 0
              fi
              echo "Waiting... attempt $i"
            done
            
            echo "ERROR: Deploy not verified within 60s"
            exit 1
          SSH

      - name: Rollback check
        if: failure()
        run: echo "Deploy failed — manual rollback required. Use 'docker compose pull && docker compose up -d' with previous tag"