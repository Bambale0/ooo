name: Deploy to Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Keep the explicit arming gate. A successful PR/fork run is NOT a release.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/neironych' }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'deploy' }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
      DEPLOY_USE_SUDO: ${{ vars.DEPLOY_USE_SUDO || 'false' }}

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Validate release and SSH configuration
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_ROOT" =~ ^/[a-zA-Z0-9_./-]+$ && "$DEPLOY_ROOT" != / && "$DEPLOY_ROOT" != *..* ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$DEPLOY_SSH_PORT > 0 && 10#$DEPLOY_SSH_PORT < 65536 ))
          [[ "$DEPLOY_USE_SUDO" == true || "$DEPLOY_USE_SUDO" == false ]]
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$RELEASE_SHA" ]]; then
            echo 'A newer main revision exists; refusing an out-of-order deployment.' >&2
            exit 1
          fi

      - name: Install pinned SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Verify SSH access before publishing an image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          remote=(bash -s)
          if [[ "$DEPLOY_USE_SUDO" == true ]]; then remote=(sudo -n bash -s); fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_HOST" \
            "${remote[*]}" <<'SSH'
          set -euo pipefail
          docker info --format '{{.ServerVersion}}' >/dev/null
          python3 --version
          SSH

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry path
        run: echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push immutable production image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.RELEASE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package and upload verified release configuration
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          bundle="/tmp/neironych-${RELEASE_SHA}.tar.gz"
          tar -czf "$bundle" \
            docker-compose.prod.yml \
            docker-compose.pitr.yml \
            nginx/production.conf \
            ops/backup/postgres \
            ops/deploy/existing_host.py \
            Dockerfile.media-probe \
            media_probe \
            ops/smoke/media_probe.py
          remote_dir="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_HOST" \
            "umask 077; mktemp -d /tmp/neironych-${RELEASE_SHA}.XXXXXX")"
          [[ "$remote_dir" =~ ^/tmp/neironych-[0-9a-f]{40}\.[a-zA-Z0-9]{6,}$ ]]
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -P "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key \
            "$bundle" "$DEPLOY_SSH_USER@$DEPLOY_HOST:${remote_dir}/release.tar.gz"
          digest="$(sha256sum "$bundle" | cut -d ' ' -f 1)"
          printf 'DEPLOY_BUNDLE_DIR=%s\nDEPLOY_BUNDLE_SHA256=%s\n' "$remote_dir" "$digest" >> "$GITHUB_ENV"

      - name: Stage temporary GHCR authentication
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          # docker/login-action already authenticated this runner with GITHUB_TOKEN.
          # Transfer only its short-lived Docker config over pinned SSH, into tmpfs.
          docker manifest inspect "${IMAGE_REPOSITORY}:${RELEASE_SHA}" >/dev/null
          runner_config="${DOCKER_CONFIG:-${HOME}/.docker}/config.json"
          test -s "$runner_config"
          auth_dir="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_HOST" \
            "umask 077; mktemp -d /dev/shm/neironych-ghcr-${RELEASE_SHA}.XXXXXX")"
          [[ "$auth_dir" =~ ^/dev/shm/neironych-ghcr-[0-9a-f]{40}\.[a-zA-Z0-9]{6,}$ ]]
          printf 'DEPLOY_AUTH_DIR=%s\n' "$auth_dir" >> "$GITHUB_ENV"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -P "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key \
            "$runner_config" "$DEPLOY_SSH_USER@$DEPLOY_HOST:${auth_dir}/config.json"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_HOST" \
            "chmod 600 '${auth_dir}/config.json'"

      - name: Deploy verified revision with automatic rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          [[ "$current" == "$RELEASE_SHA" ]] || { echo 'Superseded release; not deploying.' >&2; exit 1; }
          [[ "$DEPLOY_BUNDLE_DIR" =~ ^/tmp/neironych-[0-9a-f]{40}\.[a-zA-Z0-9]{6,}$ ]]
          [[ "$DEPLOY_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEPLOY_AUTH_DIR" =~ ^/dev/shm/neironych-ghcr-[0-9a-f]{40}\.[a-zA-Z0-9]{6,}$ ]]
          remote=(env)
          if [[ "$DEPLOY_USE_SUDO" == true ]]; then remote=(sudo -n env); fi
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -p "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_HOST" \
            "${remote[*]} RELEASE_SHA='${RELEASE_SHA}' REPOSITORY='${GITHUB_REPOSITORY}' DEPLOY_ROOT='${DEPLOY_ROOT}' DEPLOY_BUNDLE_DIR='${DEPLOY_BUNDLE_DIR}' DEPLOY_BUNDLE_SHA256='${DEPLOY_BUNDLE_SHA256}' DOCKER_CONFIG='${DEPLOY_AUTH_DIR}' bash -s" <<'SSH'
          set -euo pipefail
          [[ "$DOCKER_CONFIG" =~ ^/dev/shm/neironych-ghcr-[0-9a-f]{40}\.[a-zA-Z0-9]{6,}$ ]]
          cleanup_registry_auth() {
            rm -f -- "${DOCKER_CONFIG}/config.json"
            rmdir -- "${DOCKER_CONFIG}"
          }
          trap cleanup_registry_auth EXIT

          REPO="ghcr.io/${REPOSITORY,,}"
          TAG="${RELEASE_SHA}"
          ROOT="${DEPLOY_ROOT}"
          RELEASES="${ROOT}/releases"
          SHARED="${ROOT}/shared"
          RELEASE_DIR="${RELEASES}/${TAG}"
          REVISION_FILE="${ROOT}/REVISION"
          PREVIOUS_TAG="$(cat "${REVISION_FILE}" 2>/dev/null || true)"
          BUNDLE="${DEPLOY_BUNDLE_DIR}/release.tar.gz"
          test -d "${DEPLOY_BUNDLE_DIR}"
          test "$(stat -c '%a' "${DEPLOY_BUNDLE_DIR}")" = 700
          test -f "${BUNDLE}"
          printf '%s  %s\n' "${DEPLOY_BUNDLE_SHA256}" "${BUNDLE}" | sha256sum --check --status

          # Existing installations own their project, ports, secrets, proxy and DB.
          # Never switch them to the standalone neironych/PITR/Nginx topology.
          if [ -f "${ROOT}/compose.host.yml" ]; then
            mkdir -p "${RELEASE_DIR}"
            tar -xzf "${BUNDLE}" -C "${RELEASE_DIR}"
            python3 "${RELEASE_DIR}/ops/deploy/existing_host.py" \
              --root "${ROOT}" --revision "${TAG}" --image "${REPO}:${TAG}"
            rm -f "${BUNDLE}"
            rmdir "${DEPLOY_BUNDLE_DIR}"
            exit 0
          fi

          mkdir -p "${RELEASES}" "${SHARED}" "${RELEASE_DIR}" "${SHARED}/nginx"
          test -f "${SHARED}/.env"
          test -f "${SHARED}/.backup.env"
          test -f "${SHARED}/nginx/ssl/fullchain.pem"
          test -f "${SHARED}/nginx/ssl/privkey.pem"
          tar -xzf "${BUNDLE}" -C "${RELEASE_DIR}"
          rm -f "${BUNDLE}"
          rmdir "${DEPLOY_BUNDLE_DIR}"
          ln -sfn "${SHARED}/.env" "${RELEASE_DIR}/.env"
          ln -sfn "${SHARED}/.backup.env" "${RELEASE_DIR}/.backup.env"
          mkdir -p "${RELEASE_DIR}/nginx"
          ln -sfn "${SHARED}/nginx/ssl" "${RELEASE_DIR}/nginx/ssl"

          compose_for() {
            release_dir="$1"
            shift
            docker compose \
              --project-name neironych \
              --env-file "${release_dir}/.env" \
              -f "${release_dir}/docker-compose.prod.yml" \
              -f "${release_dir}/docker-compose.pitr.yml" \
              "$@"
          }

          verify_revision() {
            expected="$1"
            for attempt in $(seq 1 12); do
              sleep 5
              status="$(curl -fsS --max-time 10 http://localhost:8000/api/v1/readiness 2>/dev/null || true)"
              if printf '%s' "$status" | grep -Fq "\"revision\":\"${expected}\""; then
                return 0
              fi
              echo "Waiting for revision ${expected}; attempt ${attempt}/12"
            done
            return 1
          }

          rollback() {
            if [ -z "${PREVIOUS_TAG}" ]; then
              echo "No previous revision recorded; automatic rollback is unavailable"
              return 1
            fi
            previous_dir="${RELEASES}/${PREVIOUS_TAG}"
            if [ ! -d "${previous_dir}" ]; then
              echo "Previous release bundle ${previous_dir} is missing"
              return 1
            fi
            echo "Rolling back application and runtime configuration to ${PREVIOUS_TAG}"
            export NEIRONYCH_IMAGE="${REPO}:${PREVIOUS_TAG}"
            export APP_REVISION="${PREVIOUS_TAG}"
            docker pull "${NEIRONYCH_IMAGE}"
            compose_for "${previous_dir}" --profile telegram up -d --no-build \
              app worker webhook_worker telegram nginx
            verify_revision "${PREVIOUS_TAG}"
          }

          export NEIRONYCH_IMAGE="${REPO}:${TAG}"
          export APP_REVISION="${TAG}"
          docker pull "${NEIRONYCH_IMAGE}"
          compose_for "${RELEASE_DIR}" build postgres
          compose_for "${RELEASE_DIR}" run --rm -e APP_REVISION="${TAG}" app alembic upgrade head
          compose_for "${RELEASE_DIR}" --profile telegram up -d --no-build \
            app worker webhook_worker telegram nginx

          if verify_revision "${TAG}"; then
            ln -sfn "${RELEASE_DIR}" "${ROOT}/current"
            printf '%s\n' "${TAG}" > "${REVISION_FILE}"
            echo "Deploy verified: revision ${TAG} is live"
            exit 0
          fi
          echo "ERROR: revision ${TAG} did not become ready; attempting rollback"
          if rollback; then
            echo "Rollback verified: revision ${PREVIOUS_TAG} is live"
          else
            echo "CRITICAL: automatic rollback failed"
          fi
          exit 1
          SSH

      - name: Remove temporary GHCR authentication
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${DEPLOY_AUTH_DIR:-}" ]]; then exit 0; fi
          [[ "$DEPLOY_AUTH_DIR" =~ ^/dev/shm/neironych-ghcr-[0-9a-f]{40}\.[a-zA-Z0-9]{6,}$ ]]
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -p "$DEPLOY_SSH_PORT" -i ~/.ssh/deploy_key "$DEPLOY_SSH_USER@$DEPLOY_HOST" \
            "if [ -d '${DEPLOY_AUTH_DIR}' ]; then rm -f -- '${DEPLOY_AUTH_DIR}/config.json'; rmdir -- '${DEPLOY_AUTH_DIR}'; fi" || {
              echo 'Temporary GHCR authentication cleanup could not be verified.' >&2
              exit 1
            }

      - name: Remove temporary SSH identity
        if: always()
        run: rm -f ~/.ssh/deploy_key
