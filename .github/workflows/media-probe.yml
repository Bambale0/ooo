name: Media probe containment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-probe-containment:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint checker and containment test
        run: python -m ruff check media_probe tests/test_media_probe*.py ops/smoke/media_probe.py
      - name: Verify actual local Unix socket and protocol behavior
        env:
          MEDIA_PROBE_RUN_UDS_TESTS: "1"
        run: >-
          python -m pytest -q tests/test_media_probe_socket.py
          tests/test_media_probe_memory_transport.py tests/test_media_probe_measurement.py
          tests/test_media_probe_isolation.py tests/test_media_probe_seccomp.py
      - name: Build immutable-base image and verify isolated decoder over Unix socket
        # This resolves the public official Python digest and prints it in the
        # job log. The image is built for this job only and is never published.
        run: python ops/smoke/media_probe.py

      - name: Verify installed app image imports with measurement disabled
        env:
          APP_TEST_IMAGE: neironych-media-client-ci:${{ github.sha }}
        run: |
          docker build --tag "$APP_TEST_IMAGE" .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp \
            -e DATABASE_URL=postgresql+asyncpg://127.0.0.1/unused \
            --entrypoint python "$APP_TEST_IMAGE" -c \
            'from app.infrastructure.config import get_settings; import app.inference.service; import media_probe.client; assert get_settings().media_probe_socket is None'
          docker image rm "$APP_TEST_IMAGE"
