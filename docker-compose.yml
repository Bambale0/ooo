services:
  app:
    build: .
    environment:
      APP_ENV: test
      APP_NAME: neironych
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://neironych:neironych@postgres:5432/neironych # pragma: allowlist secret
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 10
      DATABASE_POOL_TIMEOUT_SECONDS: 10
      DATABASE_POOL_RECYCLE_SECONDS: 1800
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_TOKEN: change-me
      ARGOLINK_BASE_URL: https://argolink.io
      ARGOLINK_API_KEY: ""
      PROVIDER_CREDENTIALS_MASTER_KEY: change-this-to-a-random-secret-at-least-32-characters # pragma: allowlist secret
      WORKER_POLL_INTERVAL_SECONDS: 5
      WORKER_BATCH_SIZE: 10
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    command: ["python", "-m", "app.workers.generation_worker"]
    healthcheck:
      disable: true
    environment:
      APP_ENV: test
      APP_NAME: neironych
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://neironych:neironych@postgres:5432/neironych # pragma: allowlist secret
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 10
      DATABASE_POOL_TIMEOUT_SECONDS: 10
      DATABASE_POOL_RECYCLE_SECONDS: 1800
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_TOKEN: change-me
      ARGOLINK_BASE_URL: https://argolink.io
      ARGOLINK_API_KEY: ""
      PROVIDER_CREDENTIALS_MASTER_KEY: change-this-to-a-random-secret-at-least-32-characters # pragma: allowlist secret
      WORKER_POLL_INTERVAL_SECONDS: 5
      WORKER_BATCH_SIZE: 10
    depends_on:
      - postgres
      - redis

  webhook_worker:
    build: .
    command: ["python", "-m", "app.workers.webhook_worker"]
    healthcheck:
      disable: true
    environment:
      APP_ENV: test
      APP_NAME: neironych
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+asyncpg://neironych:neironych@postgres:5432/neironych # pragma: allowlist secret
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 10
      DATABASE_POOL_TIMEOUT_SECONDS: 10
      DATABASE_POOL_RECYCLE_SECONDS: 1800
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_TOKEN: change-me
      PROVIDER_CREDENTIALS_MASTER_KEY: change-this-to-a-random-secret-at-least-32-characters # pragma: allowlist secret
      WORKER_POLL_INTERVAL_SECONDS: 5
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neironych
      POSTGRES_PASSWORD: neironych # pragma: allowlist secret
      POSTGRES_DB: neironych
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    depends_on:
      - app
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
