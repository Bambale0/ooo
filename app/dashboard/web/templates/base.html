<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cabinet{% endblock %} - Нейроныч</title>
    <link rel="stylesheet" href="/static/brand.css">
    <link rel="stylesheet" href="/static/cabinet.css">
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <div class="cabinet-layout">
        <!-- Sidebar -->
        <aside class="cabinet-sidebar">
            <div class="sidebar-header">
                <div class="brand-mini">Нейроныч</div>
                <div class="company-name">{{ partner.company_name }}</div>
            </div>

            <nav class="cabinet-nav">
                <div class="nav-section">
                    <div class="nav-label">РАБОЧАЯ ОБЛАСТЬ</div>
                    <a href="/cabinet/" class="nav-link" hx-boost="true">
                        <span class="nav-icon">📊</span>
                        <span>Обзор</span>
                    </a>
                    <a href="/cabinet/generations" class="nav-link" hx-boost="true">
                        <span class="nav-icon">⚙️</span>
                        <span>Задачи генерации</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">АККАУНТ</div>
                    <a href="/cabinet/api-keys" class="nav-link" hx-boost="true">
                        <span class="nav-icon">🔑</span>
                        <span>API-ключи</span>
                    </a>
                    <a href="/cabinet/wallet" class="nav-link" hx-boost="true">
                        <span class="nav-icon">💳</span>
                        <span>Кошелёк</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">ИСПОЛЬЗОВАНИЕ</div>
                    <a href="/cabinet/statistics" class="nav-link" hx-boost="true">
                        <span class="nav-icon">📈</span>
                        <span>Статистика</span>
                    </a>
                    <a href="/cabinet/invoices" class="nav-link" hx-boost="true">
                        <span class="nav-icon">📋</span>
                        <span>Счета</span>
                    </a>
                </div>

                <div class="nav-section">
                    <div class="nav-label">НАСТРОЙКИ</div>
                    <a href="/cabinet/settings" class="nav-link" hx-boost="true">
                        <span class="nav-icon">⚙️</span>
                        <span>Аккаунт</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main -->
        <main class="cabinet-main">
            <header class="cabinet-header">
                <h1 class="page-title">{% block title %}Cabinet{% endblock %}</h1>
                <div class="header-actions">
                    <span class="user-id">ID: {{ partner.telegram_id }}</span>
                    <a href="/logout" class="button-secondary">Выход</a>
                </div>
            </header>

            <div class="cabinet-content">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</body>
</html>
