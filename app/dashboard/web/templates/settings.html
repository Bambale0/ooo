{% extends "base.html" %}

{% block title %}Настройки{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="bg-gray-800 rounded-lg p-6 border border-gray-700">
        <h2 class="text-xl font-semibold mb-4">Настройки аккаунта</h2>
        <form method="post" action="/cabinet/settings/update" class="space-y-4">
            <div>
                <label class="block text-sm mb-2">Email для платежей</label>
                <input type="email" name="payment_email" value="{{ partner.payment_email or '' }}" class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white">
            </div>
            <button type="submit" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded">
                Сохранить
            </button>
        </form>
    </div>
</div>
{% endblock %}
