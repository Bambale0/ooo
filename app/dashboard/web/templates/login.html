<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Нейроныч Partner Cabinet</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <div class="bg-gray-800 border border-gray-700 rounded-lg p-8">
            <h1 class="text-3xl font-bold text-center mb-2 text-purple-500">Нейроныч</h1>
            <p class="text-center text-gray-400 mb-8">Partner Cabinet</p>
            
            <form method="post" action="/login" class="space-y-4">
                <div>
                    <label class="block text-sm mb-2">Telegram ID</label>
                    <input type="text" name="telegram_id" required 
                           class="w-full bg-gray-700 border border-gray-600 rounded px-4 py-2 text-white placeholder-gray-500 focus:border-purple-500 focus:outline-none"
                           placeholder="Your Telegram ID">
                </div>
                
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 font-semibold py-2 rounded transition">
                    Войти в кабинет
                </button>
            </form>
            
            <p class="text-center text-gray-400 text-sm mt-6">
                Или войти через Telegram бота: <a href="https://t.me/neuromyxbot" class="text-purple-400 hover:text-purple-300">/cabinet</a>
            </p>
        </div>
    </div>
</body>
</html>
